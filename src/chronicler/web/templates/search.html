{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<h1 class="page-title">Search</h1>
<form class="search-page-form" action="/search" method="get">
  <input type="search" name="q" value="{{ query }}" aria-label="Search" autofocus>
  <select name="type" aria-label="Filter by type">
    <option value="">All types</option>
    {% for key, label in type_labels.items() %}
      <option value="{{ key }}" {% if key == type_filter %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <button type="submit">Search</button>
</form>
{% include "_results.html" %}
{% endblock %}
